stages:
  prepare_data:
    cmd: python -m src.data.prepare_data
    deps:
    - data/raw
    - params.yaml
    - src/data/prepare_data.py
    - src/utils/config.py
    outs:
    - data/processed
  train_models:
    cmd: python -m src.models.train_all
    deps:
    - data/processed
    - params.yaml
    - src/data/dataloaders.py
    - src/data/preprocessing.py
    - src/models/architectures.py
    - src/models/train_all.py
    - src/utils/config.py
    outs:
    - metrics
    - models
  evaluate:
    cmd: python -m src.models.evaluation
    deps:
    - metrics
    - models
    - src/models/evaluation.py
    outs:
    - results
